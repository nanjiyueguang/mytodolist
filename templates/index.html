<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo 任务管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 任务管理</h1>
            <div class="header-actions">
                <a href="/chat" class="btn btn-secondary" style="text-decoration:none;">🤖 智能周报</a>
                <button id="btn-create" class="btn btn-primary">➕ 创建</button>
                <button id="btn-import" class="btn btn-secondary">📥 导入</button>
                <button id="btn-export" class="btn btn-secondary">📊 导出Excel</button>
            </div>
        </header>

        <!-- 导入面板 -->
        <div id="import-panel" class="export-panel" style="display: none;">
            <h3>导入任务</h3>
            <div class="import-actions">
                <a href="/api/todos/template" class="btn btn-secondary">📄 下载导入模板</a>
                <label class="btn btn-primary" style="cursor:pointer;margin-left:10px;">
                    📤 选择文件并导入
                    <input type="file" id="import-file" accept=".xlsx,.xls" style="display:none;">
                </label>
                <button id="btn-cancel-import" class="btn btn-secondary" style="margin-left:10px;">取消</button>
            </div>
            <div id="import-result" style="margin-top:10px;"></div>
        </div>

        <!-- 导出面板 -->
        <div id="export-panel" class="export-panel" style="display: none;">
            <h3>导出任务列表</h3>
            <div class="export-form">
                <div class="form-group">
                    <label>开始日期：</label>
                    <input type="date" id="export-start-date" lang="en">
                </div>
                <div class="form-group">
                    <label>结束日期：</label>
                    <input type="date" id="export-end-date" lang="en">
                </div>
                <div class="export-actions">
                    <button id="btn-confirm-export" class="btn btn-primary">确认导出</button>
                    <button id="btn-cancel-export" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <!-- 创建任务弹窗 -->
        <div id="create-modal" class="modal-overlay" style="display:none;">
            <div class="modal-dialog">
                <div class="modal-header">
                    <h3>➕ 新建任务</h3>
                    <button class="modal-close" id="btn-modal-close">&times;</button>
                </div>
                <div class="modal-body">
                    <div class="modal-form-group">
                        <label>任务标题 <span class="required">*</span></label>
                        <input type="text" id="todo-title" placeholder="请输入任务标题" class="modal-input">
                    </div>
                    <div class="modal-form-group">
                        <label>描述</label>
                        <textarea id="todo-description" placeholder="任务描述（可选）" class="modal-textarea" rows="3"></textarea>
                    </div>
                    <div class="modal-form-row">
                        <div class="modal-form-group">
                            <label>优先级</label>
                            <select id="todo-priority" class="modal-select">
                                <option value="高">🔴 高</option>
                                <option value="中" selected>🟡 中</option>
                                <option value="低">🔵 低</option>
                            </select>
                        </div>
                        <div class="modal-form-group">
                            <label>开始日期</label>
                            <input type="date" id="todo-start-date" class="modal-input" lang="en">
                        </div>
                        <div class="modal-form-group">
                            <label>完成日期</label>
                            <input type="date" id="todo-end-date" class="modal-input" lang="en">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary" id="btn-modal-cancel">取消</button>
                    <button class="btn btn-primary" id="btn-modal-confirm">确认创建</button>
                </div>
            </div>
        </div>

        <!-- 任务列表（默认折叠） -->
        <div class="task-list-container">
            <div class="table-header">
                <div class="col-task-code">任务编码</div>
                <div class="col-task-name">任务名称</div>
                <div class="col-priority">
                    <select id="filter-priority" class="filter-select">
                        <option value="">优先级</option>
                        <option value="高">🔴 高</option>
                        <option value="中">🟡 中</option>
                        <option value="低">🔵 低</option>
                    </select>
                </div>
                <div class="col-status">
                    <div class="multi-filter" id="filter-status">
                        <select class="filter-select" id="filter-status-btn">
                            <option>状态</option>
                        </select>
                        <div class="multi-filter-dropdown" id="filter-status-dropdown" style="display:none;">
                            <label><input type="checkbox" value="待开始"> 待开始</label>
                            <label><input type="checkbox" value="进行中"> 进行中</label>
                            <label><input type="checkbox" value="暂挂"> 暂挂</label>
                            <label><input type="checkbox" value="已完成"> 已完成</label>
                            <label><input type="checkbox" value="已取消"> 已取消</label>
                        </div>
                    </div>
                </div>
                <div class="col-created-at">创建时间</div>
                <div class="col-date">
                    <label class="filter-label">开始时间</label>
                    <input type="date" id="filter-start-date" class="filter-date" lang="en">
                </div>
                <div class="col-date">
                    <label class="filter-label">完成时间</label>
                    <input type="date" id="filter-end-date" class="filter-date" lang="en">
                </div>
                <div class="col-duration">工期(天)</div>
                <div class="col-progress">进度</div>
            </div>
            <div id="task-table-body" class="table-body"></div>
        </div>

        <!-- 历史任务区域 -->
        <div class="archived-section">
            <div class="archived-header">
                <h2>📦 历史任务</h2>
                <button id="btn-toggle-archived" class="btn btn-secondary">展开</button>
            </div>
            <div id="archived-task-list" class="archived-task-list" style="display:none;"></div>
        </div>
    </div>

    <!-- MD 笔记编辑弹窗 -->
    <div id="note-modal" class="modal-overlay" style="display:none;">
        <div class="modal-dialog note-modal-dialog">
            <div class="modal-header">
                <h3>📝 任务笔记 — <span id="note-task-title"></span></h3>
                <button class="modal-close" id="btn-note-close">&times;</button>
            </div>
            <div class="modal-body note-modal-body">
                <div class="note-editor-wrap">
                    <div class="note-editor-pane">
                        <div class="note-pane-header">✎ Markdown 编辑</div>
                        <textarea id="note-content" class="note-textarea" placeholder="在此输入 Markdown 内容..."></textarea>
                    </div>
                    <div class="note-editor-pane">
                        <div class="note-pane-header">👁 实时预览</div>
                        <div id="note-preview" class="note-preview"></div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="btn-note-cancel">取消</button>
                <button class="btn btn-primary" id="btn-note-save">💾 保存</button>
            </div>
        </div>
    </div>

    <!-- 彻底删除确认弹窗 -->
    <div id="delete-confirm-modal" class="modal-overlay" style="display:none;">
        <div class="modal-dialog delete-confirm-dialog">
            <div class="modal-body" style="text-align:center;padding:32px 24px;">
                <div style="font-size:48px;margin-bottom:12px;">⚠️</div>
                <div style="font-size:16px;font-weight:600;margin-bottom:8px;">确定彻底删除此任务？</div>
                <div id="delete-confirm-desc" style="font-size:13px;color:#888;margin-bottom:20px;line-height:1.6;"></div>
                <div style="display:flex;gap:12px;justify-content:center;">
                    <button class="btn btn-secondary" id="btn-delete-cancel" style="min-width:80px;">取消</button>
                    <button class="btn btn-danger" id="btn-delete-confirm" style="min-width:80px;">确认删除</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 附件管理弹窗 -->
    <div id="attachment-modal" class="modal-overlay" style="display:none;">
        <div class="modal-dialog">
            <div class="modal-header">
                <h3>📎 附件管理</h3>
                <button class="modal-close" id="btn-attachment-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="attachment-upload-area">
                    <input type="file" id="attachment-file-input" style="display:none;">
                    <button id="btn-upload-attachment" class="btn btn-primary">📤 选择文件上传</button>
                    <span class="attachment-hint">（最大 50MB）</span>
                </div>
                <div id="attachment-list" class="attachment-list"></div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
