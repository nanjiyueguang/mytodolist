<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo 任务管理</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>📋 任务管理</h1>
            <div class="header-actions">
                <button id="btn-import" class="btn btn-secondary">📥 导入</button>
                <button id="btn-export" class="btn btn-secondary">📊 导出Excel</button>
            </div>
        </header>

        <!-- 导入面板 -->
        <div id="import-panel" class="export-panel" style="display: none;">
            <h3>导入任务</h3>
            <div class="import-actions">
                <a href="/api/todos/template" class="btn btn-secondary">📄 下载导入模板</a>
                <label class="btn btn-primary" style="cursor:pointer;margin-left:10px;">
                    📤 选择文件并导入
                    <input type="file" id="import-file" accept=".xlsx,.xls" style="display:none;">
                </label>
                <button id="btn-cancel-import" class="btn btn-secondary" style="margin-left:10px;">取消</button>
            </div>
            <div id="import-result" style="margin-top:10px;"></div>
        </div>

        <!-- 导出面板 -->
        <div id="export-panel" class="export-panel" style="display: none;">
            <h3>导出任务列表</h3>
            <div class="export-form">
                <div class="form-group">
                    <label>开始日期：</label>
                    <input type="date" id="export-start-date">
                </div>
                <div class="form-group">
                    <label>结束日期：</label>
                    <input type="date" id="export-end-date">
                </div>
                <div class="export-actions">
                    <button id="btn-confirm-export" class="btn btn-primary">确认导出</button>
                    <button id="btn-cancel-export" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>

        <!-- 新建任务 -->
        <div class="todo-form-inline">
            <input type="text" id="todo-title" placeholder="任务标题 *" class="form-control-inline form-title">
            <select id="todo-priority" class="form-control-inline form-priority">
                <option value="高">🔴 高</option>
                <option value="中" selected>🟡 中</option>
                <option value="低">🔵 低</option>
            </select>
            <input type="date" id="todo-start-date" class="form-control-inline form-date" title="开始日期">
            <input type="date" id="todo-end-date" class="form-control-inline form-date" title="结束日期">
            <input type="text" id="todo-description" placeholder="描述（可选）" class="form-control-inline form-desc">
            <button id="btn-create" class="btn btn-primary btn-create">➕ 创建</button>
        </div>

        <!-- 任务列表 -->
        <div class="task-list-container">
            <div class="table-header">
                <div class="col-task-code">任务编码</div>
                <div class="col-task-name">任务名称</div>
                <div class="col-priority">
                    <select id="filter-priority" class="filter-select">
                        <option value="">优先级</option>
                        <option value="高">🔴 高</option>
                        <option value="中">🟡 中</option>
                        <option value="低">🔵 低</option>
                    </select>
                </div>
                <div class="col-status">
                    <select id="filter-status" class="filter-select">
                        <option value="">状态</option>
                        <option value="待开始">待开始</option>
                        <option value="进行中">进行中</option>
                        <option value="暂挂">暂挂</option>
                        <option value="已完成">已完成</option>
                        <option value="已取消">已取消</option>
                    </select>
                </div>
                <div class="col-date">
                    <label class="filter-label">开始时间</label>
                    <input type="date" id="filter-start-date" class="filter-date">
                </div>
                <div class="col-date">
                    <label class="filter-label">结束时间</label>
                    <input type="date" id="filter-end-date" class="filter-date">
                </div>
                <div class="col-duration">工期(天)</div>
                <div class="col-progress">进度</div>
            </div>
            <div id="task-table-body" class="table-body"></div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
